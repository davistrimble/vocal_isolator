<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocal Isolator</title>
  <!-- url_for builds the right path to files in the static/ folder -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Vocal Isolator</h1>
    <p class="subtitle">Upload a song, get back just the vocals — ready to rehearse along with.</p>

    <form id="options-form">
      <!-- 1. the song -->
      <section>
        <h2>1. Song</h2>
        <!-- accept= makes the file picker only show mp3s -->
        <input type="file" id="song" name="song" accept=".mp3,audio/mpeg">
        <p class="hint">MP3 only, up to {{ max_upload_mb }} MB.</p>
        <p id="analysis" class="hint"></p>
      </section>

      <!-- 2. how to separate -->
      <section>
        <h2>2. Method</h2>
        <label class="choice">
          <input type="radio" name="method" value="ml" checked>
          <span><strong>Neural network (Demucs)</strong> — much cleaner, takes a minute or two</span>
        </label>
        <label class="choice">
          <input type="radio" name="method" value="classic">
          <span><strong>Classic signal processing</strong> — my original no-ML version, fast but rougher</span>
        </label>
      </section>

      <!-- 3. rehearsal options. each checkbox shows/hides the boxes under it -->
      <section>
        <h2>3. Rehearsal options</h2>

        <label class="choice">
          <input type="checkbox" name="change_key" data-reveals="key-options">
          <span>Change the key</span>
        </label>
        <div id="key-options" class="reveal" hidden>
          <label>Original key
            <select name="original_key" id="original_key">
              {% for note in note_names %}<option>{{ note }}</option>{% endfor %}
            </select>
          </label>
          <label>New key
            <select name="new_key" id="new_key">
              {% for note in note_names %}<option>{{ note }}</option>{% endfor %}
            </select>
          </label>
        </div>

        <label class="choice">
          <input type="checkbox" name="change_tempo" data-reveals="tempo-options">
          <span>Change the tempo</span>
        </label>
        <div id="tempo-options" class="reveal" hidden>
          <label>Original tempo (BPM)
            <input type="number" name="original_tempo" id="original_tempo" min="20" max="300" step="1">
          </label>
          <label>New tempo (BPM)
            <input type="number" name="new_tempo" id="new_tempo" min="20" max="300" step="1">
          </label>
        </div>

        <label class="choice">
          <input type="checkbox" name="metronome">
          <span>Add a metronome (keeps the intro as a count-in)</span>
        </label>
      </section>

      <button type="submit" id="go" disabled>Isolate vocals</button>
    </form>

    <!-- filled in by app.js while the song is processing / when it's done -->
    <section id="progress" hidden>
      <p id="status-message"></p>
      <p id="elapsed" class="hint"></p>
    </section>

    <section id="result" hidden>
      <h2>Done!</h2>
      <audio id="player" controls></audio>
      <a id="download-link" class="button">Download</a>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
